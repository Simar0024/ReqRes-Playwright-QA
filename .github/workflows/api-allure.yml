name: Automated API Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  api-testing-matrix:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v4

    - name: Setup Node.js Runtime
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Application Dependencies
      run: npm install

    # ------------------------------------------------------------------------
    # EXECUTION STAGE 1: RUN LEGACY REQRES TESTS
    # ------------------------------------------------------------------------
    - name: Execute Legacy ReqRes Automated Tests
      env:
        REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
      run: npm run test:legacy
      continue-on-error: true

    # ------------------------------------------------------------------------
    # EXECUTION STAGE 2: RUN REAL-SETUP MICROSERVICE CLUSTER
    # ------------------------------------------------------------------------
    - name: Execute Real-Setup Production Cluster Tests
      run: npm run test:real-setup
      continue-on-error: true

    # ------------------------------------------------------------------------
    # REPORT ARCHITECTURE INTEGRATION STAGE
    # ------------------------------------------------------------------------
    - name: Load Historical Test Metrics
      uses: actions/checkout@v4
      if: always()
      continue-on-error: true
      with:
        ref: gh-pages
        path: gh-pages-dir

    # Compile Part A: Legacy Test Reports into 'legacy' sub-navigation panel
    - name: Map Legacy Allure Structural Package
      uses: simple-elf/allure-report-action@master
      if: always()
      id: allure-legacy
      with:
        allure_results: allure-results
        gh_pages: gh-pages-dir
        allure_report: allure-report
        allure_history: allure-history
        subfolder: legacy

    # Compile Part B: Real-Setup Cluster Reports into 'real-setup' sub-navigation panel
    - name: Map Real-Setup Allure Structural Package
      uses: simple-elf/allure-report-action@master
      if: always()
      id: allure-real
      with:
        allure_results: real-setup/allure-results
        gh_pages: gh-pages-dir
        allure_report: allure-report
        allure_history: allure-history
        subfolder: real-setup

    - name: Deploy Accumulated Artifacts to gh-pages branch
      uses: peaceiris/actions-gh-pages@v4
      if: always()
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: allure-report

    - name: Extract Deployment Payload from Branch Context
      uses: actions/checkout@v4
      if: always()
      with:
        ref: gh-pages
        path: deployment-payload

    - name: Initialize Pages Static Hosting Layer
      uses: actions/configure-pages@v5
      if: always()

    - name: Stage Manifest Tarball Package to Hosting Engine
      uses: actions/upload-pages-artifact@v3
      if: always()
      with:
        path: 'deployment-payload'

    - name: Publish Consolidated Allure System Report Dashboard
      id: deployment
      uses: actions/deploy-pages@v4
      if: always()