name: Automated API Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Grant the workflow permission to write to GitHub Pages and contents
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  api-testing-matrix:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Codebase
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Fetches all history so git can inspect all remote branches

    - name: Ensure gh-pages Branch Exists
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # Check if the gh-pages branch exists remotely
        if ! git ls-remote --exit-code --heads origin gh-pages; then
          echo "🚀 gh-pages branch not found. Creating initialization layer..."
          
          # Create a completely detached, clean branch
          git checkout --orphan gh-pages
          git rm -rf .
          
          # Seed a baseline file so git registers a valid commit object
          echo "# Allure Test Reports Delivery Network" > README.md
          git add README.md
          git commit -m "chore: bootstrap headless gh-pages branch architecture"
          
          # Push the fresh branch back up to your repository
          git push origin gh-pages
          
          # Navigate back to the original workflow head commit context
          git checkout -
        else
          echo "✅ gh-pages branch verified on remote storage. Moving to testing sequence."
        fi

    - name: Setup Node.js Runtime environment
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Application Dependencies
      run: npm ci

    - name: Run Playwright Integration Tests
      env:
        REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
      run: npm run test
      continue-on-error: true # Prevents pipeline breakage if an API execution fails

    - name: Load Allure History (Preserves trend charts over time)
      uses: actions/checkout@v4
      if: always()
      continue-on-error: true
      with:
        ref: gh-pages
        path: gh-pages-dir

    - name: Build Allure Report Execution Package
      uses: simple-elf/allure-report-action@master
      if: always()
      id: allure-report
      with:
        allure_results: allure-results
        gh_pages: gh-pages-dir
        allure_report: allure-report
        allure_history: allure-history

    - name: Deploy Report Directly to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      if: always()
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: allure-report