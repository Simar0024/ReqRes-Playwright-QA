name: Automated API Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  api-testing-matrix:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v4

    - name: Setup Node.js Runtime
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Application Dependencies
      run: npm install

    # ------------------------------------------------------------------------
    # EXECUTION STAGE 1: RUN LEGACY REQRES TESTS
    # ------------------------------------------------------------------------
    - name: Execute Legacy ReqRes Automated Tests
      env:
        REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
      run: npm run test:legacy
      continue-on-error: true

    # ------------------------------------------------------------------------
    # EXECUTION STAGE 2: RUN REAL-SETUP MICROSERVICE CLUSTER
    # ------------------------------------------------------------------------
    - name: Execute Real-Setup Production Cluster Tests
      run: npm run test:real-setup
      continue-on-error: true

    # ------------------------------------------------------------------------
    # REPORT ARCHITECTURE INTEGRATION STAGE (Isolated Build Dirs)
    # ------------------------------------------------------------------------
    - name: Load Historical Test Metrics
      uses: actions/checkout@v4
      if: always()
      continue-on-error: true
      with:
        ref: gh-pages
        path: gh-pages-dir

    # Compile Legacy Reports inside isolated staging folder A
    - name: Map Legacy Allure Structural Package
      uses: simple-elf/allure-report-action@master
      if: always()
      id: allure-legacy
      with:
        allure_results: allure-results
        gh_pages: gh-pages-dir
        allure_report: allure-stage-legacy
        allure_history: allure-history-legacy
        subfolder: legacy

    # Compile Real-Setup Reports inside isolated staging folder B
    - name: Map Real-Setup Allure Structural Package
      uses: simple-elf/allure-report-action@master
      if: always()
      id: allure-real
      with:
        allure_results: real-setup/allure-results
        gh_pages: gh-pages-dir
        allure_report: allure-stage-real
        allure_history: allure-history-real
        subfolder: real-setup

    # ------------------------------------------------------------------------
    # UNIFIED ASSEMBLER MATRIX (Safe merging without permission blockages)
    # ------------------------------------------------------------------------
    - name: Merge Static Report Subfolders & Inject Frontend Web Portal
      if: always()
      run: |
        # Create a clean master distribution directory
        mkdir -p final-allure-payload/legacy
        mkdir -p final-allure-payload/real-setup
        mkdir -p final-allure-payload/portal
        
        # Safely extract compiled assets out from the isolated run paths
        if [ -d "allure-stage-legacy/legacy" ]; then
          cp -r allure-stage-legacy/legacy/* final-allure-payload/legacy/
        else
          cp -r allure-stage-legacy/* final-allure-payload/legacy/ 2>/dev/null || true
        fi
        
        if [ -d "allure-stage-real/real-setup" ]; then
          cp -r allure-stage-real/real-setup/* final-allure-payload/real-setup/
        else
          cp -r allure-stage-real/* final-allure-payload/real-setup/ 2>/dev/null || true
        fi

        # Remove recursive duplicates if created by the actions wrapper container
        rm -rf final-allure-payload/legacy/legacy
        rm -rf final-allure-payload/real-setup/real-setup
        
        # Move your actual client-side web portal code into the web hosting package folder
        if [ -d "real-setup/frontend" ]; then
          cp -r real-setup/frontend/* final-allure-payload/portal/
        elif [ -f "index.html" ]; then
          cp index.html final-allure-payload/portal/
        fi
        
        # Build the global center routing navigation board layout
        cat << 'EOF' > final-allure-payload/index.html
        <!DOCTYPE html>
        <html>
        <head>
            <title>QA Quality Gate Portal</title>
            <style>
                body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 50px; background: #f8f9fa; }
                .container { max-width: 650px; margin: 0 auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
                h1 { color: #202124; margin-bottom: 10px; }
                h3 { color: #5f6368; font-weight: normal; margin-bottom: 30px; }
                .btn { display: block; margin: 15px auto; padding: 15px 25px; background: #1a73e8; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; width: 65%; transition: background 0.2s; box-sizing: border-box; }
                .btn:hover { background: #1557b0; }
                .btn-secondary { background: #34a853; }
                .btn-secondary:hover { background: #24753a; }
                .btn-accent { background: #ea4335; }
                .btn-accent:hover { background: #c53929; }
            </style>
        </head>
        <body>
            <div class="container">
                <h1>Infrastructure Verification Hub</h1>
                <h3>ReqRes & Real-Setup Continuous Integration Gateway</h3>
                <hr style="border: 0; border-top: 1px solid #eee; margin-bottom: 25px;">
                
                <a href="./legacy/" class="btn">📊 View Legacy ReqRes API Report</a>
                <a href="./real-setup/" class="btn btn-secondary">🚀 View Real-Setup Test Report</a>
                <a href="./portal/" class="btn btn-accent">💻 Launch Enterprise Order Management Portal</a>
            </div>
        </body>
        </html>
        EOF
        
        touch final-allure-payload/.nojekyll

    # ------------------------------------------------------------------------
    # AUTOMATED PRODUCTION DEPLOYMENT OPERATIONS
    # ------------------------------------------------------------------------
    - name: Push Consolidated Assets to gh-pages Branch
      uses: peaceiris/actions-gh-pages@v4
      if: always()
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: final-allure-payload

    - name: Initialize Pages Static Hosting Layer
      uses: actions/configure-pages@v5
      if: always()

    - name: Stage Manifest Tarball Package to Hosting Engine
      uses: actions/upload-pages-artifact@v3
      if: always()
      with:
        path: 'final-allure-payload'

    - name: Publish Consolidated Allure System Report Dashboard
      id: deployment
      uses: actions/deploy-pages@v4
      if: always()