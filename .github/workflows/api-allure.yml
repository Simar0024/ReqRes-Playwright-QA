name: Automated API Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# CRITICAL: Grant the workflow permission to write to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  api-testing-matrix:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Codebase
      uses: actions/checkout@v4

    - name: Setup Node.js Runtime environment
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Application Dependencies
      run: npm ci

    - name: Run Playwright Integration Tests
      env:
        REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
      run: npm run test
      continue-on-error: true

    - name: Load Allure History (Preserves trend charts over time)
      uses: actions/checkout@v4
      if: always()
      with:
        ref: gh-pages
        path: gh-pages-dir

    - name: Build Allure Report Execution Package
      uses: simple-elf/allure-report-action@master
      if: always()
      id: allure-report
      with:
        allure_results: allure-results
        gh_pages: gh-pages-dir
        allure_report: allure-report
        allure_history: allure-history

    - name: Deploy Report Directly to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      if: always()
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: allure-report