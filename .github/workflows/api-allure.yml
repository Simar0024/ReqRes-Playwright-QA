name: Automated API Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  api-testing-matrix:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Main Codebase
      uses: actions/checkout@v4

    - name: Setup Node.js Runtime environment
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Application Dependencies
      run: npm ci

    - name: Run Playwright Integration Tests
      env:
        REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
      run: npm run test
      continue-on-error: true

    - name: Load Existing Allure History from gh-pages
      uses: actions/checkout@v4
      if: always()
      continue-on-error: true
      with:
        ref: gh-pages
        path: gh-pages-dir

    - name: Build Allure Report Static Assets
      uses: simple-elf/allure-report-action@master
      if: always()
      id: allure-report
      with:
        allure_results: allure-results
        gh_pages: gh-pages-dir
        allure_report: allure-report
        allure_history: allure-history

    - name: Commit and Push Report to gh-pages Branch
      uses: peaceiris/actions-gh-pages@v4
      if: always()
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: allure-report
    
    - name: Checkout Clean Copy of gh-pages Branch for Direct Deployment
      uses: actions/checkout@v4
      if: always()
      with:
        ref: gh-pages
        path: deployment-payload

    - name: Setup GitHub Pages hosting layer
      uses: actions/configure-pages@v5
      if: always()

    - name: Upload gh-pages Assets directly to Actions Engine
      uses: actions/upload-pages-artifact@v3
      if: always()
      with:
        path: 'deployment-payload'

    - name: Trigger Instant Headless Deployment
      id: deployment
      uses: actions/deploy-pages@v4
      if: always()
