name: Automated API Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  api-testing-matrix:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v4

    - name: Setup Node.js Runtime
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Application Dependencies
      run: npm install

    # ------------------------------------------------------------------------
    # EXECUTION STAGE 1: RUN LEGACY REQRES TESTS
    # ------------------------------------------------------------------------
    - name: Execute Legacy ReqRes Automated Tests
      env:
        REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
      run: npm run test:legacy
      continue-on-error: true

    # ------------------------------------------------------------------------
    # EXECUTION STAGE 2: RUN REAL-SETUP MICROSERVICE CLUSTER
    # ------------------------------------------------------------------------
    - name: Execute Real-Setup Production Cluster Tests
      run: npm run test:real-setup
      continue-on-error: true

    # ------------------------------------------------------------------------
    # REPORT ARCHITECTURE INTEGRATION STAGE (Isolated Construction)
    # ------------------------------------------------------------------------
    - name: Load Historical Test Metrics
      uses: actions/checkout@v4
      if: always()
      continue-on-error: true
      with:
        ref: gh-pages
        path: gh-pages-dir

    # Compile Part A into its own isolated target workspace output folder
    - name: Map Legacy Allure Structural Package
      uses: simple-elf/allure-report-action@master
      if: always()
      id: allure-legacy
      with:
        allure_results: allure-results
        gh_pages: gh-pages-dir
        allure_report: allure-report-legacy
        allure_history: allure-history-legacy
        subfolder: legacy

    # Compile Part B into its own isolated target workspace output folder
    - name: Map Real-Setup Allure Structural Package
      uses: simple-elf/allure-report-action@master
      if: always()
      id: allure-real
      with:
        allure_results: real-setup/allure-results
        gh_pages: gh-pages-dir
        allure_report: allure-report-real
        allure_history: allure-history-real
        subfolder: real-setup

    # ------------------------------------------------------------------------
    # UNIFIED ASSEMBLER LAYER (Merges both suites together safely)
    # ------------------------------------------------------------------------
    - name: Consolidate Subfolders into Unified Master Directory
      if: always()
      run: |
        mkdir -p final-allure-payload/legacy
        mkdir -p final-allure-payload/real-setup
        
        # Copy the compiled HTML assets safely from their isolated outputs
        if [ -d "allure-report-legacy/legacy" ]; then
          cp -r allure-report-legacy/legacy/* final-allure-payload/legacy/
        fi
        
        if [ -d "allure-report-real/real-setup" ]; then
          cp -r allure-report-real/real-setup/* final-allure-payload/real-setup/
        fi

    - name: Deploy Accumulated Artifacts to gh-pages branch
      uses: peaceiris/actions-gh-pages@v4
      if: always()
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: final-allure-payload

    # ------------------------------------------------------------------------
    # DEPLOYMENT ENGINE LAYER WITH HUB INDEX HUB ROUTER
    # ------------------------------------------------------------------------
    - name: Extract Fresh Master Payload from Branch Context
      uses: actions/checkout@v4
      if: always()
      with:
        ref: gh-pages
        path: deployment-payload

    - name: Generate Root Hub Index Router File
      if: always()
      run: |
        cat << 'EOF' > deployment-payload/index.html
        <!DOCTYPE html>
        <html>
        <head>
            <title>QA Quality Gate Portal</title>
            <style>
                body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 50px; background: #f8f9fa; }
                .container { max-width: 600px; margin: 0 auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
                h1 { color: #202124; margin-bottom: 30px; }
                .btn { display: block; margin: 15px auto; padding: 15px 25px; background: #1a73e8; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; width: 60%; transition: background 0.2s; }
                .btn:hover { background: #1557b0; }
                .btn-secondary { background: #34a853; }
                .btn-secondary:hover { background: #24753a; }
            </style>
        </head>
        <body>
            <div class="container">
                <h1>Infrastructure Verification Hub</h1>
                <a href="./legacy/" class="btn">📊 View Legacy ReqRes API Dashboard</a>
                <a href="./real-setup/" class="btn btn-secondary">🚀 View Real-Setup Cluster Dashboard</a>
            </div>
        </body>
        </html>
        EOF
        touch deployment-payload/.nojekyll

    - name: Initialize Pages Static Hosting Layer
      uses: actions/configure-pages@v5
      if: always()

    - name: Stage Manifest Tarball Package to Hosting Engine
      uses: actions/upload-pages-artifact@v3
      if: always()
      with:
        path: 'deployment-payload'

    - name: Publish Consolidated Allure System Report Dashboard
      id: deployment
      uses: actions/deploy-pages@v4
      if: always()